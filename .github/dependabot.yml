version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # ESLint 10 (released 2026) drops APIs that eslint-plugin-react still
    # depends on transitively via eslint-config-next. Until Next.js ships an
    # eslint-config-next compatible with ESLint 10, block major bumps so the
    # tooling group isn't permanently red. Revisit when eslint-config-next
    # publishes a release noting ESLint 10 support.
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
    groups:
      # Group framework majors+minors together — they share migration paths
      # (Next codemod, React types codemod) and shouldn't land separately.
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - eslint-config-next
      # Liveblocks ships SDK packages as a unit; keep them in sync.
      liveblocks:
        patterns:
          - "@liveblocks/*"
      # Drizzle ORM + kit drift in tandem.
      drizzle:
        patterns:
          - drizzle-orm
          - drizzle-kit
      # ESLint + plugins bump on a different cadence (and break with majors
      # until the Next.js plugin ecosystem catches up). Keep them in their
      # own group so a stuck eslint update doesn't block the rest.
      eslint:
        patterns:
          - eslint
          - eslint-config-prettier
      # Test/format/types toolchain — safe to roll up.
      tooling:
        patterns:
          - vitest
          - "@vitest/*"
          - prettier
          - "@playwright/test"
          - typescript
          - tsx
      # Catch-all for everything else — patches and minors only, weekly.
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - next
          - react*
          - "@types/react*"
          - eslint-config-next
          - "@liveblocks/*"
          - drizzle-orm
          - drizzle-kit
          - vitest
          - "@vitest/*"
          - eslint
          - eslint-config-prettier
          - prettier
          - "@playwright/test"
          - typescript
          - tsx
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
