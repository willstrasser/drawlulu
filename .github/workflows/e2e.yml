name: E2E Tests

on:
  push:

# Cancel any in-progress run for the same branch so parallel runs don't
# collide on the same Liveblocks room or create redundant Neon branches.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # Write the .env.test file from a GitHub secret.
      # Store the full contents of your local .env.test as the secret E2E_ENV
      # in Settings → Secrets and variables → Actions.
      - name: Create .env.test
        run: echo "$E2E_ENV" > .env.test
        env:
          E2E_ENV: ${{ secrets.E2E_ENV }}

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
